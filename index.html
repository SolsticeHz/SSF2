<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Super Smash Flash 2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;font:14px sans-serif;overflow:hidden}
  #p{width:100%;height:100%}
  #m{position:fixed;left:0;right:0;top:0;padding:8px;background:rgba(0,0,0,.75);text-align:center;z-index:5}
</style>
<script>
/* Runs first. When this page is opened through the proxy, location is spoofed, so
   "/__px/..." and "<fake origin>/__px/..." URLs would resolve to the wrong host.
   Pin them to the real proxy origin instead. */
(function () {
  var PX = "https://peekaboom-proxy.github.io";
  function fix(u) {
    try {
      var s = String(u && u.url ? u.url : u);
      var m = s.match(/^https?:\/\/[^\/]+(\/__px\/.*)$/);
      if (m) return PX + m[1];
      if (s.indexOf("/__px/") === 0) return PX + s;
    } catch (e) {}
    return u;
  }
  var f = window.fetch;
  window.fetch = function (i, o) {
    var n = fix(i);
    return f.call(this, (i && i.url && n !== i) ? new Request(n, i) : n, o);
  };
  var x = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (a, u) {
    arguments[1] = fix(u);
    return x.apply(this, arguments);
  };
})();
</script>
</head>
<body>
<div id="m">Loading Super Smash Flash 2…</div>
<div id="p"></div>
<script>
(function () {
  var PX = "https://peekaboom-proxy.github.io/__px/";
  var SITE = "https://www.supersmashflash.com";
  var SWF = PX + SITE + "/flash/games/SSF2Beta_v1_4_0_1";
  var BASE = PX + SITE + "/flash/games/";
  // The first Ruffle copy is the one the proxy already served successfully for supersmashflash.
  var RUFFLES = [PX + SITE + "/ruffle/ruffle.js", "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js"];
  var msg = document.getElementById("m");

  function loadRuffle(i, done) {
    if (i >= RUFFLES.length) { msg.textContent = "Couldn't load Ruffle."; return; }
    var s = document.createElement("script");
    s.src = RUFFLES[i];
    s.onload = function () { done(); };
    s.onerror = function () { loadRuffle(i + 1, done); };
    document.head.appendChild(s);
  }

  loadRuffle(0, function () {
    var R = window.RufflePlayer && window.RufflePlayer.newest();
    if (!R) { msg.textContent = "Ruffle didn't start."; return; }
    var pl = R.createPlayer();
    pl.style.width = "100%";
    pl.style.height = "100%";
    document.getElementById("p").appendChild(pl);
    pl.addEventListener("loadedmetadata", function () { msg.style.display = "none"; });
    pl.load({
      url: SWF, base: BASE, quality: "high", allowScriptAccess: true,
      autoplay: "on", unmuteOverlay: "hidden", letterbox: "on", splashScreen: false
    }).catch(function (e) { msg.textContent = "Couldn't download the game: " + (e && e.message || e); });
  });
})();
</script>
</body>
</html>
